name: Deploy Backend to Cloud Run

on:
  push:
    branches:
      - main
      - master
      - dev
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to Cloud Run
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bump Version
        run: |
          python backend/bump_version.py

      - name: Commit version bump
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: bump version [skip ci]"
          file_pattern: "backend/src/main.py"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/1027239076774/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-deployer@lucidex-502504.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy api \
            --source ./backend \
            --project lucidex-502504 \
            --region asia-southeast1 \
            --allow-unauthenticated
