[project]
name = "lucidex-backend"
version = "0.1.0"
description = "API-first backend for the Lucidex credential platform"
requires-python = ">=3.11,<4.0"
dependencies = [
    "arq>=0.26.0,<1.0.0",
    "beanie>=1.30.0,<2.0.0",
    "email-validator>=2.2.0,<3.0.0",
    "fastapi[standard]>=0.115.0,<1.0.0",
    "google-cloud-storage>=3.13.0,<4.0.0",
    "google-auth>=2.56.0,<3.0.0",
    "motor>=3.7.0,<4.0.0",
    "pydantic>=2.10.0,<3.0.0",
    "pydantic-settings>=2.7.0,<3.0.0",
    "pyjwt>=2.10.0,<3.0.0",
    "pyotp>=2.10.0,<3.0.0",
    "qrcode[pil]>=8.0.0,<9.0.0",
    "pwdlib[argon2,bcrypt]>=0.3.0,<1.0.0",
    "python-multipart>=0.0.20,<1.0.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0,<1.0.0",
    "pytest>=8.3.0,<10.0.0",
    "pytest-asyncio>=0.25.0,<2.0.0",
    "ruff>=0.9.0,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.fastapi]
entrypoint = "src.main:app"
