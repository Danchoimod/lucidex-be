<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ title }}</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f4f5; font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f5; padding:40px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="max-width:480px; width:100%; background-color:#ffffff; border-radius:24px; overflow:hidden; border:1px solid #e5e5e5;">
          <tr>
            <td style="padding:36px 40px 0 40px;" align="left">
              <table role="presentation" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="padding-right:10px;">
                    <div style="width:32px; height:32px; background-color:#111111; border-radius:8px; text-align:center; line-height:32px;">
                      <span style="color:#ffffff; font-size:16px; font-weight:bold;">L</span>
                    </div>
                  </td>
                  <td>
                    <span style="font-size:20px; font-weight:800; color:#111111; letter-spacing:-0.5px;">Lucidex</span>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:24px 40px 0 40px;">
              <div style="height:1px; background-color:#eeeeee; width:100%;"></div>
            </td>
          </tr>

          {{ content }}

          <tr>
            <td style="padding:32px 40px 0 40px;">
              <div style="height:1px; background-color:#eeeeee; width:100%;"></div>
            </td>
          </tr>
          <tr>
            <td style="padding:24px 40px 36px 40px;" align="center">
              <p style="margin:0; font-size:12px; line-height:18px; color:#b3b3b3;">
                &copy; {{ current_year }} Lucidex &middot; Secure. Instant. Verifiable.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
