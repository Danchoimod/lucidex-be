<tr>
  <td style="padding:32px 40px;" align="left">
    <h1 style="margin:0; font-size:24px; line-height:32px; font-weight:800; color:#111111;">
      Update on Your Lucidex Application
    </h1>
    <p style="margin:16px 0 0; font-size:15px; line-height:22px; color:#666666;">
      Hello <strong>{{ registrant_name }}</strong>,
    </p>
    <p style="margin:16px 0 0; font-size:15px; line-height:22px; color:#666666;">
      We reviewed the application for <strong>{{ institution_name }}</strong> and are unable to approve it at this time.
    </p>
    <p style="margin:16px 0 0; font-size:15px; line-height:22px; color:#666666;">
      <strong>Reason:</strong> {{ rejection_reason }}
    </p>
    <p style="margin:16px 0 0; font-size:14px; line-height:21px; color:#666666;">
      Please review the reason above before submitting a new application.
    </p>
  </td>
</tr>
