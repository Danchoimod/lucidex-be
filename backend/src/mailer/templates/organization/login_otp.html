<tr>
  <td style="padding:32px 40px 8px 40px;" align="left">
    <h1 style="margin:0; font-size:24px; line-height:32px; font-weight:800; color:#111111;">
      Confirm your organization login
    </h1>
    <p style="margin:12px 0 0 0; font-size:15px; line-height:22px; color:#666666;">
      Use the verification code below to complete your organization account login. Please do not share this code with anyone.
    </p>
  </td>
</tr>
<tr>
  <td style="padding:24px 40px;" align="center">
    <table role="presentation" cellpadding="0" cellspacing="0" width="100%">
      <tr>
        <td style="background-color:#111111; border-radius:16px; padding:24px 16px;" align="center">
          <span style="font-size:36px; font-weight:800; letter-spacing:8px; color:#ffffff; font-family:'Courier New',monospace;">
            {{ otp_code }}
          </span>
        </td>
      </tr>
    </table>
  </td>
</tr>
<tr>
  <td style="padding:28px 40px 0 40px;" align="left">
    <p style="margin:0; font-size:13px; line-height:20px; color:#999999;">
      This code expires in 5 minutes. If you did not attempt to log in, you can ignore this email.
    </p>
  </td>
</tr>
