<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lucidex Google OAuth QA</title>
  <script src="https://accounts.google.com/gsi/client" async></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 680px; margin: 48px auto; padding: 0 20px; }
    #google-button { margin: 24px 0; }
    pre { padding: 16px; background: #f5f5f5; border-radius: 8px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Owner Google OAuth QA</h1>
  <p>Sign in with Google to test the Lucidex Owner OAuth endpoint.</p>
  <div id="google-button"></div>
  <pre id="result">Waiting for sign-in.</pre>
  <script>
    const clientId = __GOOGLE_CLIENT_ID_JSON__;
    const oauthEndpoint = "/api/v1/owner/auth/google";
    const resultElement = document.getElementById("result");

    function showResult(httpStatus, payload) {
      const data = payload && payload.data ? payload.data : {};
      resultElement.textContent = JSON.stringify({
        http_status: httpStatus,
        success: payload ? payload.success : false,
        message: payload ? payload.message : "No response received.",
        error_code: payload ? payload.error_code : null,
        owner_id: data.owner_id || null,
        email: data.email || null
      }, null, 2);
    }

    async function handleGoogleCredential(response) {
      try {
        const apiResponse = await fetch(oauthEndpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ credential: response.credential })
        });
        const payload = await apiResponse.json();
        showResult(apiResponse.status, payload);
      } catch (_error) {
        showResult("unavailable", {
          success: false,
          message: "Unable to reach the OAuth endpoint.",
          error_code: "NETWORK_ERROR"
        });
      }
    }

    window.addEventListener("load", () => {
      google.accounts.id.initialize({
        client_id: clientId,
        callback: handleGoogleCredential
      });
      google.accounts.id.renderButton(
        document.getElementById("google-button"),
        { theme: "outline", size: "large", text: "signin_with" }
      );
    });
  </script>
</body>
</html>
