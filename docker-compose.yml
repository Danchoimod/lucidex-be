services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lucidex-backend
    ports:
      - "8000:8000"
    environment:
      - ENV=development
      - PORT=8000
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: lucidex-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:
